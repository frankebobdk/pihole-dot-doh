server:
  # Ref:
  # https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound.conf.html
  username: "unbound"
  # If none are given the default is to listen on localhost.
  interface: 127.0.0.1

  # Only Pi-hole (localhost) queries Unbound — refuse everything else
  access-control: 127.0.0.0/8 allow
  access-control: 0.0.0.0/0 refuse
  port: 5335

  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  # Unbound local queries needs to be off if using stubby or dnsproxy
  do-not-query-localhost: yes

  # Private addresses for local network
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 10.0.0.0/8
  private-address: fd00::/8
  private-address: fe80::/10

  # EDNS buffer size
  edns-buffer-size: 1232

  # chroot disabled, not necessary for a docker container
  chroot: ""

  # Prefer IPv4 transport (IPv6 disabled)
  prefer-ip4: yes
  prefer-ip6: no

  # Mandatory for TLS requests
  tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

  # Logging — verbosity 1 = operational events only
  #log-queries: yes
  #log-replies: yes
  #log-servfail: yes
  logfile: "/dev/stderr"
  verbosity: 1

  # Module Configuration
  module-config: "validator cachedb iterator"

  # RRset cache. Must be set to a power of 2
  rrset-cache-size: 256m
  msg-cache-size: 128m

  # Negative and key cache
  neg-cache-size: 8m
  key-cache-size: 4m

  # Threading — 2 threads with matching slabs
  num-threads: 2
  msg-cache-slabs: 2
  rrset-cache-slabs: 2
  infra-cache-slabs: 2
  key-cache-slabs: 2

  # Prefetching
  prefetch: yes
  prefetch-key: yes

  # File descriptors and queries
  outgoing-range: 8192
  num-queries-per-thread: 4096
  outgoing-num-tcp: 20
  incoming-num-tcp: 20

  # Socket buffer sizes
  so-reuseport: yes
  so-rcvbuf: 8m
  so-sndbuf: 8m

  # Cache settings
  serve-expired: yes
  cache-min-ttl: 0              # serve-expired + prefetch handle latency; 0 ensures correct CDN failover
  cache-max-ttl: 172800         # 2 days
  serve-expired-client-timeout: 0
  serve-expired-ttl-reset: no
  serve-expired-ttl: 259200     # 3 days — expired backup window
  serve-expired-reply-ttl: 30

  # Response optimization
  minimal-responses: yes        # Strip unnecessary authority/additional sections
  rrset-roundrobin: yes         # Rotate RRsets for basic load distribution
  aggressive-nsec: yes          # Synthesize NXDOMAIN from NSEC records without upstream query

  # Security hardening
  use-caps-for-id: yes          # 0x20 encoding — defense against cache poisoning

  include-toplevel: "/config/unbound/unbound.conf.d/*.conf"
