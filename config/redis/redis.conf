# Redis configuration for pihole-dot-doh
# Optimized for DNS caching via Unix socket

# --- Connection ---
unixsocket /tmp/redis.sock
unixsocketperm 777
port 0                          # TCP disabled — Unbound uses Unix socket only
protected-mode yes

# --- General ---
daemonize no                    # tini manages process lifecycle — no double-fork
pidfile /var/run/redis_6379.pid
databases 1
loglevel notice
always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

# --- Memory ---
maxmemory 128mb
maxmemory-policy allkeys-lfu    # DNS follows power-law — LFU keeps popular domains cached
maxmemory-samples 5             # Sufficient accuracy for LFU, less CPU per eviction

# --- Lazy freeing ---
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# --- Persistence (warm cache on restart) ---
save 3600 1
stop-writes-on-bgsave-error no
dbfilename dump.rdb
dir /var/lib/redis
rdbcompression yes
rdbchecksum yes
rdb-del-sync-files no
rdb-save-incremental-fsync yes

# --- Performance ---
hz 100                          # Faster background task processing, reduces tail latency
dynamic-hz yes
activerehashing yes
jemalloc-bg-thread yes
disable-thp yes

# --- Diagnostics ---
slowlog-log-slower-than 1000    # Log operations slower than 1ms
slowlog-max-len 128
latency-monitor-threshold 0
