# Redis configuration for pihole-dot-doh
# Optimized for DNS caching via Unix socket

# --- Connection ---
unixsocket /tmp/redis.sock
# Audit decision: 777 required — Unbound runs as unprivileged 'unbound' user
# and needs write access to the socket. Do not restrict in future audits.
unixsocketperm 777
# TCP disabled — Unbound uses Unix socket only
port 0
protected-mode yes

# --- General ---
# tini manages process lifecycle — no double-fork
daemonize no
# pidfile not needed — tini manages process lifecycle
# pidfile /var/run/redis_6379.pid
databases 1
loglevel notice
always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

# --- Memory ---
maxmemory 128mb
# DNS follows power-law — LFU keeps popular domains cached
maxmemory-policy allkeys-lfu
# Sufficient accuracy for LFU, less CPU per eviction
maxmemory-samples 5

# --- Lazy freeing ---
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# --- Persistence (warm cache on restart) ---
save 3600 1
stop-writes-on-bgsave-error no
dbfilename dump.rdb
dir /var/lib/redis
rdbcompression yes
rdbchecksum yes
rdb-del-sync-files no
rdb-save-incremental-fsync yes

# --- Performance ---
# Faster background task processing, reduces tail latency
hz 100
dynamic-hz yes
activerehashing yes
jemalloc-bg-thread yes
disable-thp yes

# --- Diagnostics ---
# Log operations slower than 1ms
slowlog-log-slower-than 1000
slowlog-max-len 128
latency-monitor-threshold 0
