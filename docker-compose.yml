services:
  pihole:
    build: .
    container_name: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: 'Europe/Copenhagen'
      FTLCONF_webserver_api_password: 'CHANGE_ME'
      FTLCONF_dns_upstreams: '127.0.0.1#5335'
    volumes:
      - ./config:/config
      - redis-data:/var/lib/redis
    restart: unless-stopped

volumes:
  redis-data:
